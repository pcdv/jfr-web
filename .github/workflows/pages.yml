name: demo

# the live demo on GitHub Pages: the TCP demo runs here for a few minutes, and
# exports itself as a static site (see StaticExport)
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a run still in progress
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    name: Export the TCP demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # a session of 10 s, then 3 minutes of history; the recording leaves out
      # the environment of the JVM
      - name: Run and export the demo
        run: ./gradlew tcpDemo -Pdemo.export=site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
