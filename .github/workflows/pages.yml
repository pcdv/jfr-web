name: demo

# the demos on GitHub Pages: the flak app and the TCP server each run here for a
# few minutes, and export themselves as a static site (see StaticExport), under
# a page that links both
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a run still in progress
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export:
    name: Export the demos
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # each one: a session, then 3 minutes of history; the recording leaves
      # out the environment of the JVM
      - name: Run and export the HTTP demo
        run: ./gradlew demo -Pdemo.export=$PWD/site/http

      - name: Run and export the TCP demo
        run: ./gradlew tcpDemo -Pdemo.export=$PWD/site/tcp

      - name: Add the page that links them
        run: cp src/site/index.html site/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
