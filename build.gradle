plugins {
  id 'java-library'
  id 'application'
  id 'ivy-publish'
  id 'maven-publish'
}

group = 'com.github.pcdv'

java {
  withSourcesJar()
}

publishing {
  repositories {
    ivy {
      name = 'local'
      url = "${System.properties['user.home']}/.ivy2/local"
    }
  }
  publications {
    // publish -Pversion=x.y.z, to the local Ivy repository, as flak does
    ivy(IvyPublication) {
      organisation = 'com.github.pcdv'
      module = 'jfr-web'
      from components.java
    }

    // publishToMavenLocal (or jitpack.io) using -Pversion=x.y.z
    maven(MavenPublication) {
      artifactId = 'jfr-web'
      from components.java
    }
  }
}

// 3.4.0 brings the request listener and the flak.Request JFR event
def flakVersion = '3.4.0'

repositories {
  mavenCentral()
  maven {
    url 'https://jitpack.io'
    content {
      includeGroup 'com.github.pcdv.flak'
    }
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

dependencies {
  // in the API: an AppFactory to mount on, a BeforeHook as guard
  api "com.github.pcdv.flak:flak-api:$flakVersion"
  implementation "com.github.pcdv.flak:flak-util:$flakVersion"
  // so that Profiler.start() works in any application, flak or not. NB: a
  // flak application on Netty should then pick its backend explicitly, as
  // Flak.getFactory() takes the first one found on the classpath
  implementation "com.github.pcdv.flak:flak-backend-jdk:$flakVersion"

  testImplementation "com.github.pcdv.flak:flak-spi:$flakVersion"
  testImplementation platform('org.junit:junit-bom:5.11.4')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
  mainClass = 'jfrweb.cli.Main'
}

// the command line, in the library's jar too: jbang runs it from its
// coordinates, see jbang-catalog.json
jar {
  manifest {
    attributes 'Main-Class': application.mainClass.get()
  }
}

// the command line as one jar, its dependencies in it, for the releases:
// java -jar jfr-web-<version>-all.jar <command>
tasks.register('cliJar', Jar) {
  group = 'distribution'
  description = 'Builds the command line as a self-contained jar.'
  archiveClassifier = 'all'
  manifest {
    attributes 'Main-Class': application.mainClass.get()
  }
  from sourceSets.main.output
  dependsOn configurations.runtimeClasspath
  from {
    configurations.runtimeClasspath.collect { zipTree(it) }
  }
  // their manifests and signatures; no two dependencies declare the same
  // service
  exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// the tasks below serve the pages from the sources, not the classpath: an edit
// of the interface shows on the next reload of the browser
def uiSources = file('src/main/resources').absolutePath

// a flak app to profile, and the profiler: see Demo. Ports, the recording of a
// first session, background traffic, and the directory of the endpoint history
// (build/demo-history by default): -Pdemo.port=, -Pprofiler.port=,
// -Pdemo.session=true, -Pdemo.load=true, -Pdemo.history=, and
// -Pdemo.export=<dir> to write a static site of a session and its history
tasks.register('demo', JavaExec) {
  group = 'application'
  description = 'Runs a flak app with the profiler, to try the web interface.'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'jfrweb.Demo'
  systemProperty 'jfrweb.resources', uiSources
  ['demo.port', 'profiler.port', 'demo.session', 'demo.load', 'demo.history', 'demo.export',
   'demo.export.seconds'].each { name ->
    def value = providers.gradleProperty(name)
    if (value.present)
      systemProperty name, value.get()
  }
}

// the same with a server that does not speak HTTP, through the jfrweb.ops
// API: see TcpDemo. -Pdemo.port= (9090 by default), -Pprofiler.port=,
// -Pdemo.session=true, -Pdemo.load=true, -Pdemo.history=, and
// -Pdemo.export=<dir> to write a static site of a session and its history
tasks.register('tcpDemo', JavaExec) {
  group = 'application'
  description = 'Runs an order server over TCP with the profiler, to try the web interface without HTTP.'
  classpath = sourceSets.test.runtimeClasspath
  mainClass = 'jfrweb.TcpDemo'
  systemProperty 'jfrweb.resources', uiSources
  ['demo.port', 'profiler.port', 'demo.session', 'demo.load', 'demo.history', 'demo.export',
   'demo.export.seconds'].each { name ->
    def value = providers.gradleProperty(name)
    if (value.present)
      systemProperty name, value.get()
  }
}

// jfr-web on its own: lists the JVMs of this machine, and profiles the one
// picked, with nothing to install in it (see Standalone). -Pport= (8095 by
// default), -Pdir= (~/.jfr-web by default), -Pbrowser=false
tasks.register('standalone', JavaExec) {
  group = 'application'
  description = 'Runs jfr-web on its own, to profile the other JVMs of this machine.'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'jfrweb.cli.Main'
  systemProperty 'jfrweb.resources', uiSources
  args 'standalone'
  def port = providers.gradleProperty('port')
  if (port.present)
    args '--port', port.get()
  def dir = providers.gradleProperty('dir')
  if (dir.present)
    args '--dir', dir.get()
  if (providers.gradleProperty('browser').getOrElse('true') == 'false')
    args '--no-browser'
}

test {
  useJUnitPlatform()
  // see AnalysisTest
  def keep = providers.systemProperty('jfrweb.keepRecording')
  if (keep.present)
    systemProperty 'jfrweb.keepRecording', keep.get()
}

// the tests of the interface's modules, with Node's own runner and no
// dependency (Node 21 or later, for the glob); skipped where Node is missing
tasks.register('jsTest', Exec) {
  group = 'verification'
  description = 'Runs the tests of the JS modules with Node.'
  commandLine 'node', '--test', 'src/test/js/**/*.test.js'
  inputs.dir('src/main/resources/jfrweb/ui/js')
  inputs.dir('src/test/js')
  onlyIf('Node is installed') {
    System.getenv('PATH').split(File.pathSeparator).any { dir ->
      new File(dir, 'node').isFile() || new File(dir, 'node.exe').isFile()
    }
  }
}

tasks.named('check') {
  dependsOn 'jsTest'
}
