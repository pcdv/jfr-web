plugins {
  id 'java-library'
  id 'application'
}

group = 'com.github.pcdv'

// 3.4.0 brings the request listener and the flak.Request JFR event. Until it
// is released: publishToMavenLocal -Pversion=3.4.0-SNAPSHOT in flak
def flakVersion = '3.4.0-SNAPSHOT'

repositories {
  mavenCentral()
  mavenLocal {
    content {
      includeGroup 'com.github.pcdv.flak'
    }
  }
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

dependencies {
  implementation 'tools.profiler:jfr-converter:4.0'

  // in the API: an AppFactory to mount on, a BeforeHook as guard
  api "com.github.pcdv.flak:flak-api:$flakVersion"
  implementation "com.github.pcdv.flak:flak-util:$flakVersion"
  // so that Profiler.start() works in any application, flak or not. NB: a
  // flak application on Netty should then pick its backend explicitly, as
  // Flak.getFactory() takes the first one found on the classpath
  implementation "com.github.pcdv.flak:flak-backend-jdk:$flakVersion"

  testImplementation "com.github.pcdv.flak:flak-spi:$flakVersion"
  testImplementation 'junit:junit:4.13.2'
}

application {
  mainClass = 'jfrweb.cli.Main'
}

test {
  // see AnalysisTest
  def keep = providers.systemProperty('jfrweb.keepRecording')
  if (keep.present)
    systemProperty 'jfrweb.keepRecording', keep.get()
}
